---
- name: Download NodeSource setup script
  get_url:
    url: "https://deb.nodesource.com/setup_{{ node_version }}.x"
    dest: /tmp/nodesource_setup.sh
    mode: "0755"
  become: true

- name: Run NodeSource setup script (adds Node {{ node_version }} apt repo)
  command: bash /tmp/nodesource_setup.sh
  become: true
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js and npm
  apt:
    name: nodejs
    state: present
    update_cache: yes
  become: true

- name: Verify Node.js installation
  command: node -v
  register: node_version_check
  changed_when: false

- name: Show installed Node.js version
  debug:
    msg: "Node.js installed: {{ node_version_check.stdout }}"

- name: Install PM2 globally (process manager for the Node app)
  npm:
    name: pm2
    global: yes
  become: true
