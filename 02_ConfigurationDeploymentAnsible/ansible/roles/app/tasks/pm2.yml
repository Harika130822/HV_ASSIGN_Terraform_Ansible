---
- name: Start Backend
  shell: pm2 start index.js --name travelmemory-api
  args:
    chdir: /opt/travelmemory/backend

- name: Start Frontend
  shell: pm2 start "npm start" --name travelmemory-ui
  args:
    chdir: /opt/travelmemory/frontend

- name: Save PM2 Processes
  shell: pm2 save

- name: Enable PM2 Startup
  shell: pm2 startup systemd -u ubuntu --hp /home/ubuntu